<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Find my Way</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js"></script>
</head>
<body>
    <div class="icon" aria-hidden="true">
        <img src="../icons/icon48.png" alt="Find my Way icon">
    </div>

    <div class="header">
        <h1>Find my Way</h1>
        <p>Find the most optimal routes to reach your destinations</p>
    </div>

    <form id="routeForm" class="instructions">
        <p>1. Open <strong>Google Maps</strong> and enter your destinations in any order.</p>
        <p>2. Choose the options that match your trip.</p>

        <div class="checkboxes">
            <label class="checkbox-label" for="fixedStart">
                <input type="checkbox" id="fixedStart">
                <span>Fixed starting destination</span>
            </label>

            <label class="checkbox-label" for="fixedEnd">
                <input type="checkbox" id="fixedEnd">
                <span>Fixed ending destination</span>
            </label>
        </div>

        <div class="destination-input">
            <label for="numberDestinations">3. Enter the total number of destinations</label>
            <input type="number" id="numberDestinations" placeholder="3-20" min="3" max="20" required>
        </div>

        <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>

        <div class="findButton">
            <button id="findRouteButton" type="submit">Find Route</button>
        </div>
    </form>
</body>
</html>
